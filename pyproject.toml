# The scripts' environment: what they need, and how they are tested and linted. Not a package - each script runs
# on its own (uv run scripts/<name>.py). uv sync makes the environment; uv run pytest runs tests/.
[project]
name = "3d-printing-toolkit"
version = "0"
description = "Scripts for slicer profiles, G-code and printer operations on a Prusa MK3S+"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",  # add_brim_ears.py --preview
    "numpy>=1.26",      # add_brim_ears.py
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pytest-cov>=6",
    "coverage>=7.10",
    "diff-cover>=9",
    "basedpyright>=1.31",
    "pyrefly>=1.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

# The gate, in order: tools/check.sh. Coverage follows the scripts the tests run as child processes; the floor is
# set by tools/coverage_ratchet.py raise, never by hand, and only rises.
# Some cases run a copy of scripts/ in a temporary repo/ folder (flatten_profiles.py), so the files are matched by
# pattern, not by a source folder, and [paths] counts the copy as scripts/.
[tool.coverage.run]
branch = true
include = ["*/scripts/*"]
omit = ["*/test_*.py", "*/.venv/*", "*/scad-tools/*"]
patch = ["subprocess"]

[tool.coverage.paths]
scripts = ["scripts/", "*/repo/scripts/"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_empty = true

# Only new errors fail: the ones already there are in .basedpyright/baseline.json, rewritten only to drop fixed ones.
[tool.basedpyright]
typeCheckingMode = "standard"
include = ["scripts", "tests", "tools"]
exclude = ["scad-tools", ".venv", "**/__pycache__"]
extraPaths = ["tests", "scripts", "scripts/mk3s-resume"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["scad-tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "PLW", "RUF"]

[tool.pyrefly]
# The gate's type check. Paths as basedpyright's: scripts import each other by bare name, and so do the tests.
project-includes = ["scripts", "tests", "tools"]
project-excludes = ["scad-tools", ".venv", "**/__pycache__"]
search-path = [".", "tests", "scripts", "scripts/mk3s-resume"]
