# A few filament sections in the form of PrusaSlicer's vendor bundle, for flatten_profiles.py's tests: an
# inheritance chain three deep, a section with two parents, and a renamed_from the flattened preset must drop.
[vendor]
name = Prusa Research

[filament:*common*]
compatible_printers =
cooling = 1
filament_diameter = 1.75
start_filament_gcode = "M900 K0.05 ; Filament gcode LA 1.5"

[filament:*PLA*]
inherits = *common*
bed_temperature = 60
renamed_from = "Generic PLA old"
temperature = 215

[filament:*fast*]
filament_max_volumetric_speed = 15
slowdown_below_layer_time = 4

[filament:Generic PLA]
inherits = *PLA*; *fast*
filament_cost = 25
filament_vendor = Generic

[filament:Generic PETG]
inherits = *common*
start_filament_gcode = "M107"
temperature = 240
