# chamber-baseline — the zero-cost enclosure test, steps 1 and 2 of
# docs/chamber-sensor.md's build order.
#
# THIS IS A THROWAWAY RIG, not the node in the design. It uses a DHT11 because
# ten are in the drawer, and a DHT11 tops out at 50 °C with ±2 °C — fine for
# "is the chamber 24 or 42", useless for the 60 °C figure that matters for the
# Einsy. The real three-point node (BME688 + 2× DS18B20) is the design; this
# only answers whether closing the enclosure's open side does anything at all.
#
# The real node's firmware belongs in alon/homelab next to fume-fan-esp32.md.
# This file lives here because the question it answers is an ASA print-quality
# question, and it should be deleted once the real node exists.
#
# WIRING — ESP32-C3 Super Mini
#   DHT11 3-pin module:  + → 3V3    out → GPIO4    − → GND
#   DHT11 4-pin bare:    1 → 3V3    2 → GPIO4      4 → GND   (3 = not connected)
#                        plus a 4.7k–10k pull-up from GPIO4 to 3V3.
#                        The 5K1 in the ELEGOO kit is fine for this.
#
# GPIO4 is chosen so this rig does not collide with the final pin map in
# docs/chamber-sensor.md §4 — I2C stays on 5/6, 1-Wire on 7, fan on 10 and 3.

# BUILD AND FLASH FROM POWERSHELL, NOT GIT-BASH.
#   PlatformIO refuses to install the ESP-IDF framework under an MSYS environment:
#     ERROR: MSys/Mingw is not supported...
#     ERROR ESP-IDF 5.5.5 framework installation - failed (returncode=1)
#   Unsetting MSYSTEM is NOT enough - that was tried and failed identically.
#   `esphome config` validates from EITHER shell, so this only bites at compile,
#   after the setup looks like it worked.
#     cd $env:USERPROFILE\Tools\3d-printing\firmware
#     esphome compile chamber-baseline.yaml
#
# Verified 30 Aug 2026, ESPHome 2026.8.1, built from PowerShell:
#   Successfully created esp32c3 image.
#   RAM 16.6% (53436 / 321296)   Flash 11.4% (209930 / 1835008)

esphome:
  name: chamber-baseline
  friendly_name: Chamber Baseline

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

# The C3 Super Mini logs over native USB-Serial/JTAG, not a UART bridge.
logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

sensor:
  - platform: dht
    pin: GPIO4
    model: DHT11
    temperature:
      name: "Chamber temperature"
      id: chamber_t
    humidity:
      name: "Chamber humidity"
      id: chamber_rh
    update_interval: 30s

# One tidy line per reading, so `esphome logs` is readable without an API,
# a broker or Home Assistant. Watch the trend, not any single sample —
# the DHT11's 1 °C resolution makes individual readings look steppy.
interval:
  - interval: 30s
    then:
      - lambda: |-
          if (isnan(id(chamber_t).state)) {
            ESP_LOGW("baseline", "no reading - check wiring and the pull-up");
          } else {
            ESP_LOGI("baseline", "chamber %.1f C   RH %.0f %%",
                     id(chamber_t).state, id(chamber_rh).state);
          }

# ---------------------------------------------------------------------------
# OPTIONAL: read it from a phone instead of trailing a USB cable out of the
# enclosure. Needs a secrets.yaml next to this file with wifi_ssid and
# wifi_password. Add these two blocks, reflash once over USB, then browse to
# the address it prints.
#
# wifi:
#   ssid: !secret wifi_ssid
#   password: !secret wifi_password
#
# web_server:
#   port: 80
# ---------------------------------------------------------------------------
