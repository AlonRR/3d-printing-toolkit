## Espressif's own camera driver. Pulled by the component manager on the first
## build, so that build needs network; later builds use the local cache.
dependencies:
  espressif/esp32-camera: "^2.0.0"
  ## Gives the node a resolvable name. Needed because OTA is a push and the
  ## board's DHCP address moves; see start_mdns() in wifi.c.
  espressif/mdns: "^1.2"
  idf:
    version: ">=5.0"
