# desiccant-module-a — the first physical module. Everything it does lives in the shared package;
# this file is only what makes this module THIS module.
#
# A second module is a copy of this file with a different node_name, subject and sensor_address -
# not a copy of the logic.
#
# ⭐ `subject` names the ENCLOSURE, not the board. Move this module to the cabinet and the honest
# edit is `subject`, because the history belongs to the box being measured.

substitutions:
  node_name: desiccant-module-a
  subject: Drybox A            # the SAMLA 22 L box - change when the module moves
  sda_pin: GPIO5
  scl_pin: GPIO6
  fan_pin: GPIO10
  sensor_address: "0x44"       # SHT31. The second module on a shared bus would need 0x45.
  spent_rh: "25"               # a working box sits far below this; see docs/moisture-isotherms.md
  spent_delay: 6h              # long enough that opening the door is not a verdict
  fan_period: 30min
  fan_run_time: 3min

packages:
  module: !include packages/desiccant-module.yaml
