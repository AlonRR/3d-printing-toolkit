# desiccant-module — shared firmware for ONE desiccant module, wherever it is plugged in.
#
# ⚠️ BRING-UP DRAFT: validated with `esphome config`, not yet wired or flashed.
#
# This file is a PACKAGE and renders nothing on its own. A per-module file sets the substitutions
# and includes it (see firmware/desiccant-module-a.yaml). A second module is then a few lines, and
# a fix to the logic here reaches every module at its next flash.
#
# Substitutions a module file must set:
#   node_name        ESPHome node name, e.g. desiccant-module-a
#   subject          what the entities are named after - THE ENCLOSURE, never the board
#   sda_pin scl_pin  I2C pins (house pair on a C3 SuperMini is GPIO5 / GPIO6)
#   fan_pin          PWM pin for the module fan (GPIO10 is the house fan pin)
#   sensor_address   0x44 or 0x45 for an SHT31
#   spent_rh         inlet RH that means the clay is no longer holding the box
#   spent_delay      how long it must stay there before saying so
#   fan_period       how often to circulate
#   fan_run_time     how long each circulation lasts
#
# ⭐ ENTITIES ARE NAMED AFTER THE ENCLOSURE. An id that lives on the instrument cannot outlive the
# instrument, and a module is explicitly meant to move between boxes. Name it for the box it is in,
# and moving it is a rename rather than a lost history.
#
# 🔑 THE SENSOR IS ON THE INLET, in box air. In the return path it would read the driest air in the
# system - the air that has just left the desiccant - and report a healthy box while the box is wet.

esphome:
  name: ${node_name}
  on_boot:
    priority: 600
    then:
      - output.turn_off: module_fan_pwm

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  # The SuperMini's USB-C port IS the USB_SERIAL_JTAG peripheral. The C3 mini in chamber-c3.yaml is
  # the opposite case and needs UART0; copying either setting to the other board silences the console.
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 15min
  ap:
    ssid: ${node_name}-fallback
    password: !secret ap_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

# ⛔ Deliberately no `api:` block - MQTT discovery only, matching every other node in this repo, so
# the ESPHome integration cannot discover the same device a second time and duplicate its entities.
mqtt:
  broker: !secret mqtt_host
  username: !secret mqtt_username
  password: !secret mqtt_esp_password
  topic_prefix: printer/${node_name}

i2c:
  sda: ${sda_pin}
  scl: ${scl_pin}
  scan: true

output:
  - platform: ledc
    id: module_fan_pwm
    pin: ${fan_pin}
    frequency: 25000Hz

fan:
  - platform: speed
    id: module_fan
    output: module_fan_pwm
    name: ${subject} circulation

sensor:
  - platform: sht3xd
    address: ${sensor_address}
    temperature:
      id: inlet_temp
      name: ${subject} temperature
      device_class: temperature
      state_class: measurement          # ⛔ NOT OPTIONAL - no state_class, no long-term statistics.
      accuracy_decimals: 1
    humidity:
      id: inlet_rh
      name: ${subject} humidity
      device_class: humidity
      state_class: measurement
      accuracy_decimals: 1
    update_interval: 60s

  # ⛔ NEVER COMPARE TWO RH READINGS TAKEN AT DIFFERENT TEMPERATURES. Cooler air at the same moisture
  # content simply reads a higher RH. Dew point is the quantity that can be compared between this box,
  # the room, and this box last month.
  - platform: template
    name: ${subject} dew point
    device_class: temperature
    state_class: measurement
    unit_of_measurement: °C
    accuracy_decimals: 1
    lambda: |-
      const float t = id(inlet_temp).state, rh = id(inlet_rh).state;
      if (isnan(t) || isnan(rh) || rh <= 0.0f) return NAN;
      const float g = logf(rh / 100.0f) + (17.625f * t) / (243.04f + t);
      return (243.04f * g) / (17.625f - g);
    update_interval: 120s

  - platform: wifi_signal
    name: ${subject} module RSSI
    device_class: signal_strength
    state_class: measurement
    entity_category: diagnostic
    update_interval: 60s

  - platform: uptime
    name: ${subject} module uptime
    device_class: duration
    state_class: measurement
    entity_category: diagnostic
    update_interval: 60s

binary_sensor:
  # THE ALARM THIS MODULE EXISTS FOR. A passive box fails silently: the clay saturates and nothing
  # says so. Sustained inlet RH above the threshold is that signal.
  #
  # `delayed_on` is what makes it a finding rather than a twitch - opening the door spikes RH for
  # minutes, and a spent cartridge holds it for hours.
  - platform: template
    name: ${subject} desiccant spent
    device_class: problem
    lambda: |-
      if (isnan(id(inlet_rh).state)) return {};   // no reading is not a verdict
      return id(inlet_rh).state > ${spent_rh};
    filters:
      - delayed_on: ${spent_delay}

interval:
  # Duty-cycled, not continuous. A sealed store needs the air mixed often enough to keep the reading
  # honest; between cycles there is nothing for a fan to do but wear out. Circulation also stops the
  # module reporting its own microclimate instead of the box's.
  - interval: ${fan_period}
    then:
      - fan.turn_on:
          id: module_fan
          speed: 100
      - delay: ${fan_run_time}
      - fan.turn_off: module_fan
