# desiccant-module — shared firmware for ONE self-regenerating desiccant module.
#
# ⚠️ BRING-UP DRAFT: validated with `esphome config`, not wired, not flashed. Nothing here has
# switched a real heater or driven a real servo.
#
# This file is a PACKAGE and renders nothing on its own. A per-module file sets the substitutions
# and includes it (firmware/desiccant-module-a.yaml). A second module is then a few lines, and a
# fix to the logic here reaches every module at its next flash.
#
# ------------------------------------------------------------------ THE CYCLE
#
#   ABSORBING   damper to the filament area, vent closed, heater off. The default state.
#   EXHAUSTING  damper closes the filament area and OPENS THE VENT, heater on, fan on. Moisture
#               leaves the building rather than the box.
#   COOLING     both closed, heater off, fan stirring. Hot clay RELEASES; reopening a hot module
#               would hand its water straight to the spools.
#
# ⛔ COOLING IS CLOSED ON BOTH SIDES ON PURPOSE. Cooling with the vent open would be faster, and
# wrong: a cooling bed adsorbs, and it should adsorb from the CABINET on the next phase rather than
# pull room humidity in while it cools.
#
# 🔑 The sensor reads the FILAMENT AREA, so its reading is what triggers a purge - and during a
# purge that same inlet is connected to the room instead. Readings taken while not ABSORBING
# therefore describe the room, not the cabinet, and nothing may act on them.
#
# ------------------------------------------------------------------ SAFETY
#
# Safety runs here, not in Home Assistant (docs/chamber-sensor.md §7), and the heater has two ways
# to do harm that the v1 fan-and-sensor module did not:
#
#   * heat with no way out - the vent must be PROVEN open, by a switch, not by having commanded a
#     servo there. A servo has no feedback; an unknown position means HEATER OFF.
#   * heat into the filament area - the same interlock, opposite consequence.
#
# None of it replaces the hardware ladder: thermal cutout in series with the element, a one-shot
# thermal fuse above it, and a fused supply.

esphome:
  name: ${node_name}
  on_boot:
    priority: 600
    then:
      - output.turn_off: heater_pwm
      - output.turn_off: fan_pwm
      # Position is unknown at boot. Command the safe one and let the switches confirm it.
      - servo.write:
          id: damper
          level: ${servo_absorb}

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 15min
  ap:
    ssid: ${node_name}-fallback
    password: !secret ap_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

mqtt:
  broker: !secret mqtt_host
  username: !secret mqtt_username
  password: !secret mqtt_esp_password
  topic_prefix: printer/${node_name}

i2c:
  sda: ${sda_pin}
  scl: ${scl_pin}
  scan: true

one_wire:
  - platform: gpio
    pin: ${bed_pin}

globals:
  # 0 absorbing, 1 exhausting, 2 cooling. The text sensor below is the readable half.
  - id: phase
    type: int
    restore_value: false
    initial_value: '0'
  - id: last_good_bed
    type: uint32_t
    restore_value: false
    initial_value: '0'

output:
  - platform: ledc
    id: fan_pwm
    pin: ${fan_pin}
    frequency: 25000Hz
  # PWM, not a relay: a cold PTC's inrush is thermal and lasts until the element self-heats, so
  # only limiting current during the ramp helps.
  - platform: ledc
    id: heater_pwm
    pin: ${heater_pin}
    frequency: 200Hz
  - platform: ledc
    id: servo_pwm
    pin: ${servo_pin}
    frequency: 50Hz

servo:
  - id: damper
    output: servo_pwm
    auto_detach_time: 3s      # stop holding against the end stops once it has arrived
    restore: false

fan:
  - platform: speed
    id: module_fan
    output: fan_pwm
    name: ${subject} module fan

binary_sensor:
  # THE POSITION PROOF. Commanding a servo is not knowing where it is.
  - platform: gpio
    id: at_absorb
    name: ${subject} damper at filament side
    device_class: opening
    pin:
      number: ${sw_absorb_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 100ms

  - platform: gpio
    id: at_vent
    name: ${subject} damper at vent
    device_class: opening
    pin:
      number: ${sw_vent_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 100ms

  # The trigger, and the alarm. Only meaningful while ABSORBING - see the note at the top.
  - platform: template
    id: desiccant_spent
    name: ${subject} desiccant spent
    device_class: problem
    lambda: |-
      if (id(phase) != 0) return {};              // not looking at cabinet air right now
      if (isnan(id(inlet_rh).state)) return {};   // no reading is not a verdict
      return id(inlet_rh).state > ${purge_rh};
    filters:
      - delayed_on: ${purge_delay}
    on_press:
      - script.execute: run_purge

sensor:
  - platform: sht3xd
    address: ${sensor_address}
    temperature:
      id: inlet_temp
      name: ${subject} temperature
      device_class: temperature
      state_class: measurement
      accuracy_decimals: 1
    humidity:
      id: inlet_rh
      name: ${subject} humidity
      device_class: humidity
      state_class: measurement
      accuracy_decimals: 1
    update_interval: 60s

  # The bed. Independent of the climate sensor and on a different bus, so one failure cannot blind
  # both the controller and its guard.
  - platform: dallas_temp
    id: bed_temp
    name: ${subject} desiccant bed temperature
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    on_value:
      - lambda: 'id(last_good_bed) = millis();'

  - platform: template
    name: ${subject} dew point
    device_class: temperature
    state_class: measurement
    unit_of_measurement: °C
    accuracy_decimals: 1
    lambda: |-
      const float t = id(inlet_temp).state, rh = id(inlet_rh).state;
      if (isnan(t) || isnan(rh) || rh <= 0.0f) return NAN;
      const float g = logf(rh / 100.0f) + (17.625f * t) / (243.04f + t);
      return (243.04f * g) / (17.625f - g);
    update_interval: 120s

  - platform: wifi_signal
    name: ${subject} module RSSI
    device_class: signal_strength
    state_class: measurement
    entity_category: diagnostic
    update_interval: 60s

  - platform: uptime
    name: ${subject} module uptime
    device_class: duration
    state_class: measurement
    entity_category: diagnostic
    update_interval: 60s

text_sensor:
  - platform: template
    name: ${subject} phase
    lambda: |-
      switch (id(phase)) {
        case 1: return {"exhausting"};
        case 2: return {"cooling"};
        default: return {"absorbing"};
      }
    update_interval: 10s

switch:
  # Nothing else may drive heater_pwm. Every turn-on passes the interlock and the ramp.
  - platform: template
    id: heater
    name: ${subject} regeneration heater
    icon: mdi:radiator
    optimistic: false
    restore_mode: ALWAYS_OFF
    lambda: 'return id(heater_pwm).get_level() > 0.0f;'
    turn_on_action:
      - if:
          condition:
            and:
              - binary_sensor.is_on: at_vent          # PROVEN open to the room
              - binary_sensor.is_off: at_absorb       # and shut to the filament
              - lambda: 'return id(module_fan).state;'
          then:
            - output.set_level:
                id: heater_pwm
                level: 25%
            - delay: 3s
            - output.set_level:
                id: heater_pwm
                level: 60%
            - delay: 3s
            - output.set_level:
                id: heater_pwm
                level: 100%
          else:
            - logger.log: "heater refused: vent not proven open, or fan stopped"
    turn_off_action:
      - output.turn_off: heater_pwm

script:
  # ---------------------------------------------------------------- EXHAUSTING
  - id: run_purge
    mode: single                      # a second trigger must not restart a running cycle
    then:
      - lambda: 'id(phase) = 1;'
      - servo.write:
          id: damper
          level: ${servo_vent}
      - wait_until:
          condition:
            and:
              - binary_sensor.is_on: at_vent
              - binary_sensor.is_off: at_absorb
          timeout: 20s
      - if:
          condition:
            binary_sensor.is_off: at_vent
          then:
            # The damper did not arrive. Do not heat; go back to a known-safe state.
            - logger.log: "purge aborted: damper never reached the vent"
            - script.execute: run_cool
          else:
            - fan.turn_on:
                id: module_fan
                speed: 100
            - delay: 3s
            - switch.turn_on: heater
            # END ON THE BED, NOT ON A TIMER. While water is leaving, evaporation holds the bed
            # temperature down; when it stops, the bed climbs to setpoint and stays there. That
            # plateau ending IS the measurement that the clay has given up what it is going to.
            - wait_until:
                condition:
                  for:
                    time: ${purge_settle}
                    condition:
                      lambda: 'return !isnan(id(bed_temp).state) && id(bed_temp).state >= ${regen_c} - 2;'
                timeout: ${purge_max}
            - script.execute: run_cool

  # ---------------------------------------------------------------- COOLING
  - id: run_cool
    mode: restart
    then:
      - switch.turn_off: heater
      - lambda: 'id(phase) = 2;'
      - servo.write:
          id: damper
          level: ${servo_closed}
      - fan.turn_on:
          id: module_fan
          speed: 100
      - wait_until:
          condition:
            lambda: 'return !isnan(id(bed_temp).state) && id(bed_temp).state < ${cool_below_c};'
          timeout: ${cool_max}
      - script.execute: run_absorb

  # ---------------------------------------------------------------- ABSORBING
  - id: run_absorb
    mode: restart
    then:
      - switch.turn_off: heater
      - servo.write:
          id: damper
          level: ${servo_absorb}
      - wait_until:
          condition:
            binary_sensor.is_on: at_absorb
          timeout: 20s
      - fan.turn_off: module_fan
      - lambda: 'id(phase) = 0;'

button:
  - platform: template
    name: ${subject} run regeneration
    on_press:
      - script.execute: run_purge
  - platform: template
    name: ${subject} back to absorbing
    on_press:
      - script.execute: run_absorb

interval:
  # THE SAFETY LOOP. Independent of WiFi, MQTT and Home Assistant.
  - interval: 5s
    then:
      - lambda: |-
          const bool stale = (id(last_good_bed) == 0) || (millis() - id(last_good_bed) > 60000);
          const float bed = id(bed_temp).state;
          const bool vent_open = id(at_vent).state && !id(at_absorb).state;
          if (id(heater_pwm).get_level() > 0.0f) {
            if (stale || isnan(bed) || bed > ${regen_ceiling_c} || !vent_open || !id(module_fan).state) {
              ESP_LOGW("safety", "heater cut: stale=%d bed=%.1f vent_open=%d fan=%d",
                       stale, bed, vent_open, id(module_fan).state);
              id(heater).turn_off();
            }
          }
      # Bang-bang against the bed while exhausting: the element self-limits and the mass is slow,
      # so hysteresis beats an untuned PID on a heater.
      - if:
          condition:
            lambda: 'return id(phase) == 1 && !isnan(id(bed_temp).state);'
          then:
            - if:
                condition:
                  lambda: 'return id(bed_temp).state > ${regen_c};'
                then:
                  - switch.turn_off: heater
                else:
                  - if:
                      condition:
                        lambda: 'return id(bed_temp).state < ${regen_c} - 3;'
                      then:
                        - switch.turn_on: heater

  # Circulation while ABSORBING. Duty-cycled: a sealed store needs the air mixed often enough to
  # keep the reading honest, not constantly, and between cycles a fan only wears out.
  - interval: ${fan_period}
    then:
      - if:
          condition:
            lambda: 'return id(phase) == 0;'
          then:
            - fan.turn_on:
                id: module_fan
                speed: 100
            - delay: ${fan_run_time}
            - fan.turn_off: module_fan
