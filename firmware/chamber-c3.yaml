# chamber-c3 — the chamber sensor after the ESP32-S3 left for the cell-tester project.
#
# WHY THIS EXISTS. The S3 CAM was reassigned (Alon, 11 Sep 2026) because cell-tester
# needs a camera to read QR labels off battery cells and has no other board that can.
# That board WAS the live chamber sensor, so the sensing half moves here: an interim
# C3 mini, held until the C3 SuperMinis get their antenna fix, carrying the AHT20+BMP280.
#
# WHAT IS LOST, so it is a decision rather than a surprise:
#   * The camera. No /raw, no Prusa Connect upload, no future spaghetti detection.
#     The C3 has no camera interface and 4 MB of flash.
#   * The persisted-disconnect-counter proof (README open item 9c). It is deployed on
#     the S3 and unproven, and proving it needs a reboot of THAT board. It has to be
#     re-proved here instead, which is why there is no drop counter below yet.
#
# WHAT IS GAINED: pressure, which the chamber has never had, and a second independent
# temperature reading — see the BMP280 note below.

esphome:
  name: chamber-c3

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  # ⚠️ hardware_uart IS REQUIRED HERE, and chamber-sensor-mini1.yaml says otherwise.
  # That file claims "the default sends the console to UART0, which is what the bridge
  # carries". Measured 11 Sep 2026 and it is wrong: on the C3 under esp-idf, ESPHome
  # defaults the logger to USB_SERIAL_JTAG — the OTHER USB-C port.
  #
  # The symptom is precise and misleading: the ROM bootloader prints to UART0, so the
  # bridge shows `ESP-ROM:esp32c3-api1-20210207`, `rst:0x1 (POWERON)` and the load/entry
  # lines — and then goes SILENT the moment ESPHome's own logger takes over. It looks
  # like the firmware hung during boot. It has not; the console simply moved to a port
  # with no cable in it.
  hardware_uart: UART0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The node lives in an enclosure, so it must never sit waiting for a human.
  reboot_timeout: 15min
  ap:
    ssid: chamber-c3-fallback
    password: !secret ap_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

# ⛔ DELIBERATELY NO `api:` BLOCK.
# Home Assistant gets these entities via MQTT discovery, matching what the S3's C
# firmware published. Adding the native API as well would let the ESPHome integration
# discover the same device a second time and create a DUPLICATE set of entities — which
# is precisely the confusion this migration is trying to avoid.

mqtt:
  broker: !secret mqtt_host
  username: !secret mqtt_username
  password: !secret mqtt_esp_password
  topic_prefix: printer/chamber-c3
  # discovery defaults to true. ESPHome also publishes birth/will messages, which is
  # the availability half — HA marks the entities unavailable when the will fires.

# ---------------------------------------------------------------------------- I2C
#
# SDA=GPIO10, SCL=GPIO3. Chosen against the ESP32-C3's real constraints rather than
# whatever was convenient, and validated with `esphome config` rather than assumed:
#
#   GPIO2, 8, 9    STRAPPING. ESPHome warns on all three. GPIO2 must be HIGH at reset,
#                  and a slave holding SDA low across a reset would prevent boot until
#                  the sensor is power-cycled — physical access, from inside a box.
#   GPIO18, 19     USB-Serial-JTAG. ESPHome warns explicitly.
#   GPIO20, 21     UART0, which the on-board bridge uses. That is the console.
#   GPIO11-17      internal SPI flash, not broken out.
#   GPIO0, 1       XTAL_32K_P / XTAL_32K_N — free ONLY if no 32.768 kHz crystal is
#                  fitted. Avoided: ESPHome cannot know, so it cannot warn.
#
# GPIO10 and GPIO3 have no alternate function at all, which is why they are the pair
# with no caveat attached. Both are on the same header as 3V3 and GND, so the whole
# sensor harness leaves from one side of the board.
#
# ⚠️ THE MODULE'S PIN ORDER IS NOT THE USUAL ONE: VDD, SDA, GND, SCL — GND sits
# BETWEEN the two bus lines. Muscle memory puts GND on SDA and the bus never comes up.
# It carries its own pull-ups, so do not add any.
i2c:
  sda: GPIO10
  scl: GPIO3
  scan: true

sensor:
  # ------------------------------------------------------------------ AHT20
  # The reason for the swap. A DHT11 floors at 20 %RH in 1 % steps; this chamber was
  # measured below 20 % in 7.3 % of 22,021 samples, and a working drybox lives at
  # 5-15 %. The AHT20 covers 0-100 % at 0.1 %.
  - platform: aht10
    variant: AHT20
    temperature:
      name: Chamber temperature
      device_class: temperature
      state_class: measurement      # ⛔ NOT OPTIONAL — see the note at the bottom.
      accuracy_decimals: 1
    humidity:
      name: Chamber humidity
      device_class: humidity
      state_class: measurement
      accuracy_decimals: 1
    update_interval: 30s

  # ------------------------------------------------------------------ BMP280
  # Pressure is new to the chamber. The BMP280's own temperature is exposed rather than
  # hidden because it is a FREE CROSS-CHECK: a second, independent die reading the same
  # air. Two sensors on one module disagreeing is a real signal, and it is a better
  # reference than the spare DHT11 would have been — that part cannot be trusted below
  # 20 %RH, which is exactly where this chamber operates.
  - platform: bmp280_i2c
    # 0x77, MEASURED not assumed. This was 0x76 on the first flash — the commonly
    # quoted default — and the boot scan settled it:
    #     Found device at address 0x38     <- AHT20
    #     Found device at address 0x77     <- this part
    #     [E][bmp280.sensor:133]: Communication failed
    # The failure is silent in Home Assistant: the entities appear and simply read
    # `unknown` forever, which looks like a wiring fault rather than a wrong address.
    # That is why `scan: true` stays on above — it costs one line at boot and turns a
    # guess into a reading.
    address: 0x77
    temperature:
      name: Chamber temperature (BMP280)
      device_class: temperature
      state_class: measurement
      accuracy_decimals: 1
    pressure:
      name: Chamber pressure
      device_class: atmospheric_pressure
      state_class: measurement
      accuracy_decimals: 1
    update_interval: 30s

  # ------------------------------------------------------- link diagnostics
  # Kept from the S3 build because the midnight-event investigation runs on them:
  # something re-associates this node at 00:00 UTC, four consecutive nights so far.
  - platform: wifi_signal
    name: Chamber WiFi RSSI
    device_class: signal_strength
    state_class: measurement
    entity_category: diagnostic
    update_interval: 60s

  - platform: uptime
    name: Chamber uptime
    device_class: duration
    state_class: measurement
    entity_category: diagnostic
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    bssid:
      name: Chamber WiFi BSSID
      entity_category: diagnostic

# =============================================================================
# TWO THINGS THAT WILL BITE WHOEVER DEPLOYS THIS
# =============================================================================
#
# 1. state_class IS WHAT MAKES THE HISTORY DURABLE, AND ITS ABSENCE IS SILENT.
#    Home Assistant records states for any sensor but builds LONG-TERM STATISTICS —
#    the rows that survive the recorder purge and that Grafana reads for long ranges —
#    only for sensors that declare one. Measured on this very node: 5,461 temperature
#    and 16,338 humidity state rows with ZERO statistics rows. Real, queryable, visible
#    in the UI, and on a purge clock. It is set explicitly on every numeric sensor above
#    rather than relying on platform defaults.
#
# 2. THE ENTITY IDS WILL NOT MATCH THE OLD ONES, AND THAT IS EXPECTED.
#    HA keys long-term statistics to the ENTITY_ID. The S3's C firmware published
#    explicit unique_ids (chamber_temp, chamber_rh, ...) which is why its entity_ids
#    were stable across reflashes. ESPHome CANNOT do that — verified: a per-sensor
#    `unique_id:` is rejected as an invalid option, and `discovery_unique_id_generator`
#    only selects between built-in schemes. So this node will create NEW entities under
#    `sensor.chamber_c3_*`, and the 243 statistics rows stay on `sensor.print_chamber_*`.
#
#    That is recoverable and the plan is in docs/chamber-sensor.md: run both boards
#    during an overlap, compare the series, then delete the old registry entries and
#    rename these onto the original entity_ids. Verify the statistics actually follow
#    the rename before releasing the S3 — do not assume it.
