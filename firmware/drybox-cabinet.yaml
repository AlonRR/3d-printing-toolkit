# drybox-cabinet — sealed desiccant store for filament, with a drying mode.
#
# ⚠️ BRING-UP DRAFT: validated with `esphome config`, not yet wired or flashed. Nothing below has
# switched a real heater.
#
# ⛔ SETTLE THE NAME BEFORE THE FIRST FLASH. Home Assistant keys long-term statistics to the
# entity_id, and ESPHome derives entity_ids from `name:`. Renaming after history accrues costs a
# registry repoint — see docs/chamber-sensor.md.
#
# ⭐ ENTITIES ARE NAMED AFTER THE CABINET, NEVER THE BOARD. An id that lives on the instrument
# cannot outlive the instrument, and this node will be replaced before the cabinet is.
#
# ------------------------------------------------------------------ WHAT THIS CONTROLS
#
# Three modes, and the middle one is the one people leave out (docs/drybox-cabinet.md):
#
#   DRY    vents OPEN, circulation fan continuous, heater modulated to the setpoint.
#   PURGE  vents OPEN, heater OFF, fans still running - flush the warm wet air OUT while it is
#          still warm and still holding the water. Skipping this hands the water back to the
#          spools on cooldown, and to the desiccant, which is worse.
#   STORE  vents CLOSED, everything off. The desiccant holds the box. This is the default state
#          and where the cabinet spends nearly all of its life.
#
# ⛔ 50 °C IS A CEILING, NOT A TARGET TO EXCEED. Bentonite gives up moisture above ~50 °C instead
# of adsorbing it (docs/moisture-isotherms.md), so a hotter setpoint makes the STORE phase worse.
#
# ------------------------------------------------------------------ WIRING (C3 SuperMini)
#
#   GPIO5  SDA ──┬── SHT31  (0x44)  top shelf
#   GPIO6  SCL ──┴── BME688 (0x76)  bottom shelf
#   GPIO7  1-Wire ── DS18B20 at the heater OUTLET, with a 4.7k pull-up to 3V3
#   GPIO10 ───────── MOSFET ch1 gate  →  PTC heater  (through the KSD9700 + one-shot fuse)
#   GPIO4  ───────── MOSFET ch2 gate  →  circulation fan
#   GPIO3  ───────── exhaust fan  (optional; omit and the vents are manual)
#   GPIO21 ───────── door switch to GND (internal pull-up)
#
# Pins avoided, and why: GPIO2/8/9 are strapping; GPIO18/19 are USB-Serial-JTAG on this board;
# GPIO0/1 are XTAL_32K and are free only if no 32.768 kHz crystal is fitted, which ESPHome cannot
# know and therefore cannot warn about.
#
# ⛔ THE NODE LIVES OUTSIDE THE CABINET, with only sensor tails passing through a gland. A board
# that self-heats beside its own humidity sensor reads warm and dry - biased toward exactly the
# "it is fine in there" conclusion this build exists to test.
#
# ⚠️ I2C ADDRESS TRAP: two AHT20s CANNOT share this bus - the address is fixed at 0x38 and the C3
# has one I2C controller. That is why the second point is an SHT31 (0x44) rather than a second
# AHT20. A TCA9548A mux is the alternative if identical parts are unavoidable.
#
# ------------------------------------------------------------------ SAFETY
#
# Safety logic runs HERE, not in Home Assistant (docs/chamber-sensor.md §7). It must hold when
# WiFi is down, the broker is restarting, or HA is being updated.
#
# ⭐ AND THE FAIL-SAFE INVERTS relative to the chamber. There, a missing reading must mean FAN ON.
# Here, a missing or stale reading must mean HEATER OFF - "no reading" must never read as "not hot".
#
# The hardware ladder underneath this is not optional and is not replaced by any of it: KSD9700
# cutout in series with the element, a one-shot thermal fuse above it, and a fused supply.

esphome:
  name: drybox-cabinet
  on_boot:
    # Belt and braces: the outputs are OFF before anything else runs, whatever the boot reason.
    priority: 600
    then:
      - output.turn_off: heater_pwm
      - output.turn_off: circ_fan_pwm
      - output.turn_off: exhaust_fan_pwm

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  # The SuperMini's USB-C port IS the USB_SERIAL_JTAG peripheral - no bridge chip. The C3 mini in
  # chamber-c3.yaml is the opposite case and needs UART0; copying either setting to the other board
  # silences the console.
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 15min
  ap:
    ssid: drybox-cabinet-fallback
    password: !secret ap_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

# ⛔ Deliberately no `api:` block - MQTT discovery only, matching chamber-c3.yaml, so the ESPHome
# integration cannot create a second, duplicate set of entities.
mqtt:
  broker: !secret mqtt_host
  username: !secret mqtt_username
  password: !secret mqtt_esp_password
  topic_prefix: printer/drybox-cabinet

i2c:
  sda: GPIO5
  scl: GPIO6
  scan: true

one_wire:
  - platform: gpio
    pin: GPIO7

globals:
  # Milliseconds of the last good control reading. The staleness check below compares against it,
  # so a sensor that stops publishing cuts the heater instead of being silently trusted.
  - id: last_good_reading
    type: uint32_t
    restore_value: false
    initial_value: '0'

output:
  # PWM, not a relay: the soft-start ramp is what handles a cold PTC's inrush, which is thermal
  # rather than electrical and therefore lasts until the element self-heats.
  - platform: ledc
    id: heater_pwm
    pin: GPIO10
    frequency: 200Hz
    max_power: 1.0
  - platform: ledc
    id: circ_fan_pwm
    pin: GPIO4
    frequency: 25000Hz
  - platform: ledc
    id: exhaust_fan_pwm
    pin: GPIO3
    frequency: 25000Hz

fan:
  - platform: speed
    id: circulation_fan
    output: circ_fan_pwm
    name: Cabinet circulation fan
  - platform: speed
    id: exhaust_fan
    output: exhaust_fan_pwm
    name: Cabinet exhaust fan

switch:
  # The heater is a template switch rather than a plain output switch so that every turn-on goes
  # through the interlock and the ramp. Nothing else may drive heater_pwm.
  - platform: template
    id: heater
    name: Cabinet heater
    icon: mdi:radiator
    optimistic: false
    restore_mode: ALWAYS_OFF
    lambda: 'return id(heater_pwm).get_level() > 0.0f;'
    turn_on_action:
      - if:
          condition:
            # ⛔ INTERLOCK: heat only ever moves when air does. Mirrors the wiring, where the
            # heater's switched leg is fed from the fan's output, so the two agree rather than
            # compete.
            lambda: 'return id(circulation_fan).state;'
          then:
            - output.set_level:
                id: heater_pwm
                level: 25%
            - delay: 3s
            - output.set_level:
                id: heater_pwm
                level: 60%
            - delay: 3s
            - output.set_level:
                id: heater_pwm
                level: 100%
          else:
            - logger.log: "heater refused: circulation fan is not running"
    turn_off_action:
      - output.turn_off: heater_pwm

sensor:
  # ------------------------------------------------------------ cabinet climate, two points
  # Two points, because one cannot see stratification - and a cabinet stratifies where a 22 L box
  # does not. Top reading much drier than bottom means the air is not being moved, which is a
  # finding about the fan, not about the desiccant.
  - platform: sht3xd
    address: 0x44
    temperature:
      name: Cabinet temperature top
      device_class: temperature
      state_class: measurement          # ⛔ NOT OPTIONAL - without it there are no long-term statistics.
      accuracy_decimals: 1
    humidity:
      id: rh_top
      name: Cabinet humidity top
      device_class: humidity
      state_class: measurement
      accuracy_decimals: 1
    update_interval: 30s

  - platform: bme680
    address: 0x76
    temperature:
      id: temp_bottom
      name: Cabinet temperature bottom
      device_class: temperature
      state_class: measurement
      accuracy_decimals: 1
      on_value:
        # The control sensor's liveness is what the staleness check reads.
        - lambda: 'id(last_good_reading) = millis();'
    humidity:
      id: rh_bottom
      name: Cabinet humidity bottom
      device_class: humidity
      state_class: measurement
      accuracy_decimals: 1
    pressure:
      name: Cabinet pressure
      device_class: atmospheric_pressure
      state_class: measurement
      accuracy_decimals: 1
    gas_resistance:
      name: Cabinet gas resistance
      state_class: measurement
      entity_category: diagnostic
    update_interval: 30s

  # ------------------------------------------------------------ heater outlet, safety
  # Independent of the climate sensors and on a different bus, so one failure cannot blind both
  # the controller and its guard. 1-Wire because it tolerates the cable run; I2C does not.
  - platform: dallas_temp
    id: outlet_temp
    name: Cabinet heater outlet temperature
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s

  # ------------------------------------------------------------ derived
  # ⛔ NEVER COMPARE TWO RH READINGS AT DIFFERENT TEMPERATURES. Cooler air at the same moisture
  # content simply reads a higher RH. Dew point is the comparable quantity, and it is what says
  # whether the cabinet is actually drier than the room.
  - platform: template
    name: Cabinet dew point
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    unit_of_measurement: °C
    lambda: |-
      const float t = id(temp_bottom).state, rh = id(rh_bottom).state;
      if (isnan(t) || isnan(rh) || rh <= 0.0f) return NAN;
      const float g = logf(rh / 100.0f) + (17.625f * t) / (243.04f + t);
      return (243.04f * g) / (17.625f - g);
    update_interval: 60s

  - platform: wifi_signal
    name: Cabinet WiFi RSSI
    device_class: signal_strength
    state_class: measurement
    entity_category: diagnostic
    update_interval: 60s

  - platform: uptime
    name: Cabinet uptime
    device_class: duration
    state_class: measurement
    entity_category: diagnostic
    update_interval: 60s

binary_sensor:
  - platform: gpio
    id: door_open
    name: Cabinet door
    device_class: door
    pin:
      number: GPIO21
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 500ms
    on_press:
      # An open door during a cycle is not an error, but heating the room is pointless and the
      # measurement that follows is meaningless.
      - switch.turn_off: heater

climate:
  # Bang-bang against the bottom sensor, not PID: the mass is large and slow, the element is
  # self-limiting, and an untuned PID on a heater is a worse failure mode than 0.5 °C of swing.
  - platform: thermostat
    id: cabinet_dryer
    name: Cabinet dryer
    sensor: temp_bottom
    min_heating_off_time: 60s
    min_heating_run_time: 60s
    min_idle_time: 30s
    heat_action:
      - switch.turn_on: heater
    idle_action:
      - switch.turn_off: heater
    visual:
      min_temperature: 20
      max_temperature: 50      # the clay ceiling, in the UI as well as in the interlock below
      temperature_step: 0.5
    preset:
      - name: Dry
        default_target_temperature_low: 45°C
        mode: heat

script:
  # DRY: fan first, then heat. The order is the interlock's, so software and wiring agree.
  - id: start_dry_cycle
    mode: restart
    then:
      - fan.turn_on:
          id: circulation_fan
          speed: 100
      - fan.turn_on:
          id: exhaust_fan
          speed: 60
      - delay: 5s
      - climate.control:
          id: cabinet_dryer
          mode: HEAT

  # PURGE: heater off FIRST, fans keep running. This is the step that makes the cycle work.
  - id: start_purge
    mode: restart
    then:
      - climate.control:
          id: cabinet_dryer
          mode: 'OFF'
      - switch.turn_off: heater
      - fan.turn_on:
          id: circulation_fan
          speed: 100
      - fan.turn_on:
          id: exhaust_fan
          speed: 100
      - wait_until:
          condition:
            lambda: 'return !isnan(id(temp_bottom).state) && id(temp_bottom).state < 30.0f;'
          timeout: 45min
      - script.execute: start_store

  # STORE: sealed and unheated. Close the vents by hand in v1 - see the doc.
  - id: start_store
    mode: restart
    then:
      - climate.control:
          id: cabinet_dryer
          mode: 'OFF'
      - switch.turn_off: heater
      - fan.turn_off: exhaust_fan
      - fan.turn_off: circulation_fan

button:
  - platform: template
    name: Cabinet start dry cycle
    on_press:
      - script.execute: start_dry_cycle
  - platform: template
    name: Cabinet start purge
    on_press:
      - script.execute: start_purge
  - platform: template
    name: Cabinet store mode
    on_press:
      - script.execute: start_store

interval:
  # THE SAFETY LOOP. Runs regardless of WiFi, MQTT or Home Assistant.
  - interval: 5s
    then:
      - lambda: |-
          const bool stale = (id(last_good_reading) == 0) ||
                             (millis() - id(last_good_reading) > 120000);
          const float outlet = id(outlet_temp).state;
          const bool outlet_bad = isnan(outlet) || outlet > 65.0f;
          const float t = id(temp_bottom).state;
          const bool over = !isnan(t) && t > 50.0f;
          if (stale || outlet_bad || over || !id(circulation_fan).state) {
            if (id(heater_pwm).get_level() > 0.0f) {
              ESP_LOGW("safety", "heater cut: stale=%d outlet=%.1f over=%d fan=%d",
                       stale, outlet, over, id(circulation_fan).state);
            }
            id(heater).turn_off();
          }
