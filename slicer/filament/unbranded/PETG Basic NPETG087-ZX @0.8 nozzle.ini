filament_notes = "Unbranded OEM PETG Basic, SKU NPETG087-ZX, batch B2204001W.\n\nTHERE IS NO BRAND. Verified from the packaging 3 Sep 2026: no manufacturer on the spool label, none on the carton, none in the carton parameter table. The carton is generic OEM - a printed checklist of product lines (PLA Basic / PLA+ / PLA Pro / PLA Matte / PLA HS / PLA Rainbow / PLA Silk / PETG Basic / PETG HS / ABS / ASA / PA / TPU 95A) with a tick-box for the one inside. The SKU is the only identity this filament has, which is why it is in the filename.\n\nNOT FILLAMENTUM, though it was described that way. Ruled out three ways: Fillamentum names its PETG colours (Black Soul, Ghost White, Vertigo Grey) and never 'Basic'; Fillamentum publishes 235-255 C / 65-75 C at +/- 0.05 mm against this spool's 230-260 C / 70-90 C at +/- 0.03 mm; and 36 ILS/kg against a premium Czech brand at several times that.\n\nPURCHASE: 10 kg bundle 'PETG Basic - Black & White', a bundle order, 29 Aug 2026, 360 ILS at a bundle rate. 36 ILS/kg - the cheapest filament in this repo by volume at 0.046 ILS/cm3, about 8 % under Yasin3D PETG.\n\nSPOOL LABEL - the only real source, since the vendor's web page publishes no temperatures at all:\nPrinting temp 230-260 C. Bed 70-90 C. Diameter 1.75 mm.\nCARTON: tolerance +/- 0.03 mm, between Inslogic's +/- 0.02 and Fillamentum's +/- 0.05.\n\nDRYING: 50 C for 4 h. INHERITED, NOT THIS SPOOL'S SPEC. This filament publishes no drying schedule at all. 50 C / 4 h is the figure from Inslogic's PETG Pro TDS - a real vendor number for the same material, which is a better basis than the 55-65 C ranges quoted generically online. Do not go hotter. PETG's glass transition is around 80 C, but spools deform and windings FUSE well below that, and a welded spool is unrecoverable; 50 C leaves 30 C of headroom and the extra speed from 65 C does not pay for the risk. Method: printer bed at 50 C with a cardboard box over the spool, a gap left so moist air can escape rather than recirculate. NOT a kitchen oven - domestic ovens cycle far outside their setpoint at low temperatures. NOT inside the Lack enclosure - the Einsy board lives in that frame.\n\nTHERE IS NO TDS. No density, no drying schedule, no mechanical data, no glass transition. Every other profile in this repo is derived from a vendor data sheet; this one cannot be. It has to be settled by a calibration print, and the numbers below are a starting point rather than a specification.\n\nDENSITY IS AN ASSUMPTION, NOT A SPEC. 1.27 g/cm3 is the generic figure for PETG. It feeds cost-per-volume and the filament-used estimate, so if either matters, weigh a known length and correct it.\n\nBED 75/75, 5 C above the bottom of the label's 70-90 C range. MEASURED ON THIS PRINTER, NOT INHERITED: the schubox warped at 70/70; the lid printed at 75/75 with no warping. Same filament, same sheet, same large flat-bottomed geometry - the bed temperature is what changed, which is why this is the one setpoint here backed by a print rather than by a data sheet. The label permits 90 C, which makes it more tempting than the Inslogic case and no less damaging: PETG at that temperature bonds to a smooth PEI sheet strongly enough to tear PEI off it on removal. Here 90 C is INSIDE vendor spec, which changes nothing about the sheet. If the first layer will not stick at 75 C, raise toward 85/90 - and put down a thin glue-stick release layer first, which is what makes the higher bed safe rather than what makes it work.\n\nTEMPERATURE 240 C sits mid-band in the label's 230-260 C and matches the Inslogic PETG profile this was derived from, so there is nothing to justify moving it before a test.\n\nCOOLING is the parent's 30 % min / 50 % max. No vendor figure exists to deviate from; heavy part cooling is the standard way to ruin PETG layer adhesion.\n\nUNTESTED - no calibration print has been run with this profile yet."
