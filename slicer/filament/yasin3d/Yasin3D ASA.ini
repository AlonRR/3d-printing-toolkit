# Yasin3D ASA — Prusa MK3S+, 0.4 / 0.6 nozzle
# The 0.4-family sibling of the existing `Yasin3D ASA @0.8 nozzle`.
# Yasin3D publishes no technical data sheet, so every printing number here is
# Prusa's Prusament ASA value. See README.md in this folder.

bed_temperature = 110
bridge_fan_speed = 30
chamber_minimal_temperature = 0
chamber_temperature = 0
compatible_printers = 
compatible_printers_condition = nozzle_diameter[0]!=0.8 and printer_notes!~/.*MINI.*/ and printer_notes!~/.*PG.*/ and ! (printer_notes=~/.*PRINTER_VENDOR_PRUSA3D.*/ and printer_notes=~/.*PRINTER_MODEL_MK(2.5|3).*/ and single_extruder_multi_material)
compatible_prints = 
compatible_prints_condition = 
cooling = 1
cooling_perimeter_transition_distance = 0
cooling_slowdown_logic = uniform_cooling
custom_parameters_filament = ""
disable_fan_first_layers = 4
enable_dynamic_fan_speeds = 0
end_filament_gcode = "; Filament-specific end gcode"
extrusion_multiplier = 1
fan_always_on = 1
fan_below_layer_time = 20
filament_abrasive = 0
filament_colour = #FFF2EC
filament_cooling_final_speed = 3.4
filament_cooling_initial_speed = 2.2
filament_cooling_moves = 4
filament_cost = 54
filament_density = 1.07
filament_deretract_speed = nil
filament_diameter = 1.75
filament_infill_max_crossing_speed = 0
filament_infill_max_speed = 0
filament_load_time = 0
filament_loading_speed = 28
filament_loading_speed_start = 3
filament_max_volumetric_speed = 11
filament_minimal_purge_on_wipe_tower = 15
filament_multitool_ramming = 0
filament_multitool_ramming_flow = 10
filament_multitool_ramming_volume = 10
filament_notes = "Yasin3D ASA - no vendor data sheet exists.\n\nWHAT IS ACTUALLY KNOWN: the vendor, the material type, 1.75 mm, and the price. Everything else - 260 C, 20 % fan off for the first 4 layers, 11 mm3/s, density 1.07 - is inherited from Prusament ASA and is Prusa's figure, not Yasin3D's.\n\nPRICE: 54 ILS, carried over from the existing 'Yasin3D ASA @0.8 nozzle' profile. Yasin3D ASA is NOT in the current filamentcenter.co.il catalogue (checked 29 Aug 2026 - only PETG at 39 ILS and ABS at 49 ILS are listed), so this figure is historical, not a current listing.\n\nDELIBERATE EDIT: first-layer bed raised from the parent's 105 C to 110 C, so both layers run at 110. This mirrors the same edit already made in the @0.8 profile.\n\nASA needs the enclosure and produces fumes worth extracting - the same conditions as the Inslogic ASA profiles.\n\nUNTESTED - no calibration print has been run with this profile yet."
filament_purge_multiplier = 100%
filament_ramming_parameters = "120 100 5.70968 6.03226 7 8.25806 9 9.19355 9.3871 9.77419 10.129 10.3226 10.4516 10.5161| 0.05 5.69677 0.45 6.15484 0.95 8.76774 1.45 9.20323 1.95 9.95806 2.45 10.3871 2.95 10.5677 3.45 7.6 3.95 7.6 4.45 7.6 4.95 7.6"
filament_retract_before_travel = nil
filament_retract_before_wipe = nil
filament_retract_layer_change = nil
filament_retract_length = nil
filament_retract_length_toolchange = nil
filament_retract_lift = nil
filament_retract_lift_above = nil
filament_retract_lift_below = nil
filament_retract_restart_extra = nil
filament_retract_restart_extra_toolchange = nil
filament_retract_speed = nil
filament_seam_gap_distance = nil
filament_settings_id = 
filament_shrinkage_compensation_xy = 0%
filament_shrinkage_compensation_z = 0%
filament_soluble = 0
filament_spool_weight = 1000
filament_stamping_distance = 0
filament_stamping_loading_speed = 20
filament_toolchange_delay = 0
filament_travel_lift_before_obstacle = nil
filament_travel_max_lift = nil
filament_travel_ramping_lift = nil
filament_travel_slope = nil
filament_type = ASA
filament_unload_time = 0
filament_unloading_speed = 90
filament_unloading_speed_start = 100
filament_vendor = Yasin3D
filament_wipe = nil
