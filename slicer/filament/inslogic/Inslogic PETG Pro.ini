# Inslogic PETG Pro — Prusa MK3S+, 0.4 / 0.6 nozzle
# Built from the Inslogic PETG Pro Technical Data Sheet (rev. 12.02.2024),
# archived at ../../reference/inslogic_petg_pro_tds.pdf.
# Parent is Generic PETG, not Prusament PETG: Prusament PETG carries
# `nozzle_diameter[0]!=0.6` and would hide this profile on a 0.6 nozzle, which
# the TDS explicitly supports. See README.md.

bed_temperature = 70
bridge_fan_speed = 50
chamber_minimal_temperature = 0
chamber_temperature = 0
compatible_printers = 
compatible_printers_condition = nozzle_diameter[0]!=0.8 and printer_model!="MK2SMM" and printer_notes!~/.*MINI.*/ and printer_notes!~/.*PG.*/ and ! (printer_notes=~/.*PRINTER_VENDOR_PRUSA3D.*/ and printer_notes=~/.*PRINTER_MODEL_MK(2.5|3).*/ and single_extruder_multi_material) and printer_model!="MK3.5" 
compatible_prints = 
compatible_prints_condition = 
