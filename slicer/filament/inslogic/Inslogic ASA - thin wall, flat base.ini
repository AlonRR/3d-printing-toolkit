filament_notes = "Inslogic ASA, THIN STEM + FLAT PLATE BASE variant — TDS rev. 12.02.2024.\n\nUSE FOR: a part that is mostly thin/short-layer (wants 70 % fan) but begins with a\nwide flat plate that must not be fan-cooled. Built for Stem_for_Rose_5cm.stl.\nDO NOT USE FOR: normal bulk ASA parts — 70 % fan splits layers. Use 'Inslogic ASA'.\n\nDIFFERENCE FROM 'Inslogic ASA - thin wall': disable_fan_first_layers 4 -> 10. Nothing\nelse. The stem behaviour is deliberately identical to the vase profile, which was\nprint-validated 29 Jul 2026.\n\nWHY: the leaves print flat over layers 1-9 and are BENT UP by hand afterwards, so\ninterlayer bonding in that plate is structural. At 4, the fan hits full speed at\nlayer 5 and chills five of the nine leaf layers; ASA bonded under high cooling snaps\nwhen bent rather than deforming. 10 covers the whole plate.\n\nMODEL FACTS worth keeping (measured from the STL, not assumed):\n- Leaves: Z 0 to ~1.75 mm, 106.9 mm span, 3090 mm2 flat plate.\n- Stem: SOLID, ~5.75 mm diameter, no interior void at any height, up to 197.92 mm\n  (MK3S+ Z limit is 210 mm).\n- Every cross-section shrinks going up, so NO SUPPORTS are needed. Thorns are small\n  outward bumps that bridge fine.\n- Measured layer times with this cooling: leaf region ~94 s, stem ~8.8 s. The stem\n  figure is the one that matters — the print that failed sat at 5.0 s.\n\n⛔ DO NOT slice this model with the print profile '0.2mm QUALITY @MK3 - ... lightning'.\nThat profile has spiral_vase = 1 baked in (the only one of the eight that does). The\nstem is SOLID, so vase mode would hollow it into a single 0.45 mm wall with no top —\na 198 mm flagpole that would not survive handling. Use the same profile name WITHOUT\n'lightning' (vase off, 2 perimeters, 15 % infill).\n\nUNTESTED - built 29 Jul 2026."
