filament_notes = "Inslogic TPU 95A, FAST/high-flow EXPERIMENT — TDS rev. 12.02.2024.\n\nPURPOSE: find out whether the 1.2 mm3/s flow ceiling on this printer's TPU\nprofiles comes from the FILAMENT or from the PRINTER, before buying a genuine\nhigh-flow grade. Not a validated profile.\n\nPARENT: NinjaTek Cheetah TPU (a real 95A high-speed grade, 4.0 mm3/s, and it\nraises retraction to 1.5 mm where Generic FLEX uses 0). NOT Generic FLEX.\n\nWHY 225 C (vs 210 C on the standard 'Inslogic TPU 95A'):\nFlow is going from 1.2 to 4.0 mm3/s - 3.3x the material through the same melt\nzone per second - which needs more heat to keep up. 225 C sits just under\nInslogic's stated 230 C maximum. First layer 230 C, at that maximum, for\nadhesion. Cheetah's own parent runs 240 C but that is a different polymer;\nstaying inside the Inslogic TDS matters more than matching the parent.\n\nFAN 100 % is from the TDS and is correct for TPU - it does not warp.\nBED 50 C is the TDS floor and matches Prusa's *FLEX* base.\nUse the TEXTURED PEI sheet, per the TDS. On smooth PEI, TPU can bond hard\nenough to damage the sheet.\n\nNOTE ON THE CEILING: 4.0 mm3/s is a ceiling, not a target, but the print profile\nwill actually reach it - infill at 80 mm/s demands 7.2 mm3/s at 0.45 x 0.2, so\nthe cap is what governs infill. This profile therefore genuinely exercises 4.0.\n\nFAILURE MODES TO WATCH: gaps or thinning in perimeters (under-extrusion), or\nfilament dust around the Bondtech gears (grinding). Both mean the material cannot\nsustain the flow - stop, clear the gears, and treat it as evidence that a real\nhigh-flow grade is the fix rather than a profile change.\n\nCONFIRMED 30 Jul 2026 — VaseRose_5cm printed clean with this profile.\nMeasured on the real model, not a swatch:\n  old profile (1.2 mm3/s) ... 2 h 53 m\n  this profile (4.0 mm3/s) .. 1 h 40 m    = 1.73x faster\n\nWHAT THIS SETTLES: the 1.2 mm3/s ceiling was the PROFILE, not the material.\nStandard Inslogic TPU 95A sustains 4.0 mm3/s on this MK3S+ with no under-extrusion\nand no grinding. A dedicated high-flow grade (NinjaTek Cheetah, Overture High\nSpeed) is therefore NOT needed to reach this speed — do not buy one on speed\ngrounds alone.\n\nThe 1.73x here is lower than the 2.16x the swatch slice predicted, because the\ncap only binds where the print profile asks for more than 4.0 mm3/s. Perimeters at\n45 mm/s need 4.05, infill at 80 mm/s needs 7.2 — so infill is governed by the cap\nand perimeters are barely touched. Expect bigger gains on infill-heavy parts and\nsmaller ones on thin-walled parts.\n\nSTILL UNKNOWN: whether 4.0 is the actual limit. It was chosen because it is what\nPrusa rates Cheetah/Overture at on MK3-family printers, not because this filament\nwas tested to its edge. If more speed is wanted, raise filament_max_volumetric_speed\nin steps and watch for the same failure modes."
