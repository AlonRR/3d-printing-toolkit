# Inslogic TPU 95A — Prusa MK3S+, 0.4 / 0.6 nozzle
# Built from Inslogic TPU 95A Technical Data Sheet (rev. 12.02.2024).
#
# Parent is Generic FLEX, NOT Ultrafuse TPU-95A. That matters — see README.md.
# The Ultrafuse TPU-95A chain descends from Ultrafuse TPC-45D (a near-rigid
# copolyester) and inherits a 15 mm3/s volumetric limit and a 40 C bed from it.
# Generic FLEX is the soft-TPU chain: 1.2 mm3/s and a 50 C bed, which is exactly
# the bed temperature Inslogic specifies.

bed_temperature = 50
bridge_fan_speed = 100
chamber_minimal_temperature = 0
chamber_temperature = 0
compatible_printers = 
compatible_printers_condition = nozzle_diameter[0]>=0.35 and nozzle_diameter[0]!=0.8 and printer_model!="MK2SMM" and printer_notes!~/.*MINI.*/ and printer_notes!~/.*PG.*/ and ! single_extruder_multi_material
compatible_prints = 
compatible_prints_condition = 
cooling = 0
cooling_perimeter_transition_distance = 0
cooling_slowdown_logic = uniform_cooling
custom_parameters_filament = ""
disable_fan_first_layers = 3
enable_dynamic_fan_speeds = 0
end_filament_gcode = "; Filament-specific end gcode"
extrusion_multiplier = 1.15
fan_always_on = 1
fan_below_layer_time = 100
filament_abrasive = 0
filament_colour = #008000
filament_cooling_final_speed = 3.4
filament_cooling_initial_speed = 2.2
filament_cooling_moves = 4
filament_cost = 82
filament_density = 1.23
filament_deretract_speed = 25
filament_diameter = 1.75
filament_infill_max_crossing_speed = 0
filament_infill_max_speed = 0
filament_load_time = 0
filament_loading_speed = 28
filament_loading_speed_start = 3
filament_max_volumetric_speed = 1.2
filament_minimal_purge_on_wipe_tower = 15
filament_multitool_ramming = 0
filament_multitool_ramming_flow = 10
filament_multitool_ramming_volume = 10
filament_notes = "Inslogic TPU 95A — TDS rev. 12.02.2024.\n\nVENDOR SPEC:\nDiameter 1.75 +/- 0.03 mm, 1 kg spool. Density 1.23 g/cm3.\nDrying: 50 C for 4 h.\nNozzle sizes: 0.4 / 0.6 mm.\nNozzle temp: 190-210 C at 50-80 mm/s; 210-230 C at 80-120 mm/s.\nBed: 50-60 C. Bed type: TEXTURED PEI sheet / cool plate.\nShore 95A. HDT(0.45 MPa) 53 C. Elongation at break 1050 %.\n\nWHY 210 C: the MK3S+ prints TPU slowly (well under 80 mm/s), so the TDS's\nlow-speed band applies. 210 C is the top of that band - highest layer\nadhesion without entering the high-speed range the printer never reaches.\nNote this is well BELOW the 225 C that the Ultrafuse TPU-95A profile uses;\nInslogic's stated maximum is 230 C at speeds this printer will not hit.\n\nBED SHEET: Inslogic specifies a TEXTURED PEI sheet. On a smooth PEI sheet\nTPU bonds hard enough to damage the sheet on removal. Use the textured one.\n\nFAN 100 % is straight from the TDS and is correct here - unlike ASA, TPU does\nnot warp, so full cooling is safe.\n\nFIRST TUNING KNOB: retraction is inherited from Generic FLEX, which sets it to\n0 (no retraction). If stringing is bad on the MK3S+'s direct drive, try ~0.8 mm\nat 25 mm/s before changing anything else.\n\nUNTESTED - no calibration print has been run with this profile yet."
filament_purge_multiplier = 100%
filament_ramming_parameters = "120 100 6.6 6.8 7.2 7.6 7.9 8.2 8.7 9.4 9.9 10.0| 0.05 6.6 0.45 6.8 0.95 7.8 1.45 8.3 1.95 9.7 2.45 10 2.95 7.6 3.45 7.6 3.95 7.6 4.45 7.6 4.95 7.6"
filament_retract_before_travel = 2
filament_retract_before_wipe = nil
filament_retract_layer_change = nil
filament_retract_length = 0
filament_retract_length_toolchange = nil
filament_retract_lift = nil
filament_retract_lift_above = nil
filament_retract_lift_below = nil
filament_retract_restart_extra = nil
filament_retract_restart_extra_toolchange = nil
filament_retract_speed = nil
filament_seam_gap_distance = nil
filament_settings_id = 
filament_shrinkage_compensation_xy = 0%
filament_shrinkage_compensation_z = 0%
filament_soluble = 0
filament_spool_weight = 1000
filament_stamping_distance = 0
filament_stamping_loading_speed = 20
filament_toolchange_delay = 0
filament_travel_lift_before_obstacle = nil
filament_travel_max_lift = nil
filament_travel_ramping_lift = nil
filament_travel_slope = nil
filament_type = FLEX
filament_unload_time = 0
filament_unloading_speed = 90
filament_unloading_speed_start = 100
filament_vendor = Inslogic
filament_wipe = 0
first_layer_bed_temperature = 50
first_layer_temperature = 215
full_fan_speed_layer = 0
idle_temperature = nil
inherits = Generic FLEX
max_fan_speed = 100
min_fan_speed = 100
min_print_speed = 15
